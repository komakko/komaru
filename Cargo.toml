[package]
name = "komaru"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
build = "build.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "avif-native"] }
rfd = "0.17.2"
pollster = "0.4"
thiserror = "2.0.21"
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.23.1"
fast_image_resize = { version = "6.1.0", features = ["only_u8x4"] }
moxcms = "0.8.1"
mp4parse = "0.17.0"
percent-encoding = "2.3.2"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse", "display"] }
directories = "6.0.0"
webp = { version = "0.3.1", default-features = false }
kamadak-exif = { version = "0.6.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
x11rb = "0.14.0"
rustix = { version = "1.1.5", default-features = false, features = ["std", "event"] }

[patch.crates-io]
winit = { path = "vendor/winit" }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "loading"
harness = false
